name: PR Review

on:
  pull_request:
    types: [opened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automated-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          sdk-components: |
            platforms;android-35
            build-tools;35.0.0

      - name: Run checks
        id: checks
        run: |
          ./gradlew testDebugUnitTest :app:koverVerifyDebug lintDebug assembleDebug > review-checks.log 2>&1
          echo "exit=$?" >> $GITHUB_OUTPUT

      - name: Static review vs AGENTS.md golden rules
        id: static
        run: |
          {
            echo "### 🤖 Automated PR review"
            echo ""
            if [ "${{ steps.checks.outputs.exit }}" != "0" ]; then
              echo "**❌ Blocking:** \`testDebugUnitTest :app:koverVerifyDebug lintDebug assembleDebug\` failed. See the CI workflow logs."
            else
              echo "✅ \`testDebugUnitTest\`, \`:app:koverVerifyDebug\` (80% line/branch gate), \`lintDebug\`, \`assembleDebug\` all passed."
            fi
            echo ""
            echo "**Golden-rule scan (AGENTS.md):**"
            findings=0
            if git diff --name-only origin/main...HEAD | grep -qE 'NoteStore|NoteRepository'; then
              if git diff origin/main...HEAD -- '*.kt' | grep -qiE 'syncthing|conflict|\.stfolder'; then
                echo "- ❌ Sync-specific logic detected in storage changes (must stay sync-agnostic)."
                findings=1
              else
                echo "- ✅ Storage changes contain no sync-specific logic."
              fi
              if git diff origin/main...HEAD -- '*.kt' | grep -qE 'Dispatchers\.Main' | grep -v 'withContext(Dispatchers\.Main)' || git diff origin/main...HEAD -- '*.kt' -- . ':(exclude)**/src/test/**' | grep -qE 'runBlocking|Thread\.sleep'; then
                echo "- ❌ Possible main-thread/blocking I/O in changed code — move to Dispatchers.IO."
                findings=1
              else
                echo "- ✅ No obvious main-thread I/O in changed code."
              fi
            else
              echo "- ℹ️ No storage-layer changes in this PR."
            fi
            changed_kt=$(git diff --name-only origin/main...HEAD -- '*.kt' | grep -v src/test || true)
            if [ -n "$changed_kt" ] && ! git diff --name-only origin/main...HEAD | grep -q 'src/test'; then
              echo "- ⚠️ Kotlin source changed but no test file changed — add/adjust tests if new logic was introduced."
            fi
            if ! git diff origin/main...HEAD --name-only | grep -q 'docs/lessons/'; then
              echo "- ⚠️ No \`docs/lessons/\` entry in this PR. If this change taught you something, add one (see docs/WORKFLOW.md)."
            else
              echo "- ✅ docs/lessons/ updated."
            fi
            if ! git diff origin/main...HEAD --name-only | grep -q 'AGENTS.md\|docs/\|CONTRIBUTING.md'; then
              echo "- ℹ️ No doc/AGENTS.md changes (fine if none were needed)."
            fi
            echo ""
            echo "The implementing agent self-reviews next: review your own diff against the PR-template checklist, push the review as comments on this PR, then fix those comments in follow-up commits. No human review step."
          } > review-comment.md
          cat review-comment.md

      - name: Request AI code review (Copilot)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers: ['copilot'],
            }).catch(e => console.log('copilot review request:', e.message));

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-comment.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const bot = comments.find(c => c.user.type === 'Bot' && c.body.includes('Automated PR review'));
            if (bot) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: bot.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
